<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Treino</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card2: #273449; --text: #f1f5f9; --muted: #94a3b8;
    --accent: #22c55e; --accent-ink: #052e16; --warn: #f59e0b; --line: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  .topo { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
  .pill { background: var(--card); border-radius: 999px; padding: 4px 12px; }
  .aviso { background: #422006; color: #fde68a; border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
  .info { background: var(--card); color: var(--muted); border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
  .fila { background: #1e3a8a; color: #dbeafe; border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
  .hero { margin: 20px 0 8px; }
  .hero small { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
  .hero h1 { margin: 2px 0 0; font-size: 34px; line-height: 1.1; }
  .hero h2 { margin: 4px 0 0; font-size: 18px; font-weight: 500; color: var(--accent); }
  .letras { display: flex; gap: 8px; margin: 14px 0 6px; }
  .letras button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: 16px; }
  .letras button.ativo { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .letras button.prox:not(.ativo) { border-color: var(--accent); color: var(--text); }
  .card { background: var(--card); border-radius: 16px; margin-top: 14px; overflow: hidden; transition: opacity .2s; }
  .card.off { opacity: .4; }
  .foto { position: relative; background: #fff; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; }
  .foto img { width: 100%; height: 100%; object-fit: contain; }
  .foto .sem { color: #64748b; font-size: 14px; padding: 0 16px; text-align: center; }
  .foto .dica { position: absolute; right: 8px; bottom: 8px; background: rgba(15,23,42,.75); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .corpo { padding: 14px; }
  .nome { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .nome h3 { margin: 0; font-size: 18px; }
  .tag { background: #14532d; color: #bbf7d0; font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .linha { display: flex; gap: 10px; margin-top: 12px; align-items: flex-end; }
  .campo { flex: 1; }
  .campo label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .stepper { display: flex; align-items: center; background: var(--card2); border-radius: 12px; }
  .stepper button { width: 44px; height: 48px; border: 0; background: transparent; color: var(--text); font-size: 22px; }
  .stepper input { width: 100%; min-width: 0; text-align: center; }
  input { height: 48px; border: 0; border-radius: 12px; background: var(--card2); color: var(--text); font-size: 18px; padding: 0 12px; width: 100%; }
  input::placeholder { color: #64748b; font-size: 14px; }
  .feito { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 14px; }
  .feito input { width: 22px; height: 22px; accent-color: var(--accent); }
  .rodape { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 24px 16px 16px; }
  .rodape div { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { height: 54px; border-radius: 14px; border: 0; font-size: 17px; font-weight: 600; }
  .btn.prim { flex: 1; background: var(--accent); color: var(--accent-ink); }
  .btn.sec { padding: 0 18px; background: var(--card); color: var(--text); }
  .btn:disabled { opacity: .5; }
  .hist { margin-top: 28px; }
  .hist h4 { margin: 0 0 8px; color: var(--muted); font-weight: 500; font-size: 14px; }
  .hist ul { margin: 0; padding: 0; }
  .hist li { list-style: none; display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .hist .pul { color: var(--warn); }
  .centro { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
  .centro .grande { font-size: 56px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; }
  .modal.on { display: flex; }
  .folha { background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px 16px 24px; }
  .folha h3 { margin: 0 0 6px; }
  .folha p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .folha .acoes { display: flex; gap: 10px; margin-top: 14px; }
  .folha .acoes .btn { flex: 1; }
  .toast { position: fixed; left: 16px; right: 16px; top: 16px; background: #7f1d1d; color: #fee2e2; padding: 12px 14px; border-radius: 12px; display: none; z-index: 10; }
</style>
</head>
<body>
<main id="app"><div class="centro"><div class="grande">🏋️</div><div>Carregando seu treino…</div></div></main>

<div class="rodape" id="rodape" hidden>
  <div>
    <button class="btn sec" onclick="abrirPular()">Pular</button>
    <button class="btn prim" id="salvar" onclick="salvar()">Salvar treino</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="folha">
    <h3>Pular o treino <span id="mLetra"></span>?</h3>
    <p>Fica anotado no Registro como pulado, e o app passa para o próximo treino.</p>
    <input id="motivo" placeholder="Motivo (opcional): cansaço, viagem…">
    <div class="acoes">
      <button class="btn sec" onclick="fecharPular()">Cancelar</button>
      <button class="btn prim" onclick="confirmarPular()">Pular treino</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
const K_ESTADO = 'treino.estado', K_FILA = 'treino.fila';

let estado = ler(K_ESTADO);
let fila = ler(K_FILA) || [];
let atual = estado ? estado.proximo : null;
let telaFeito = false;
let enviando = false;

// ---------- armazenamento local ----------
function ler(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- conversa com a planilha ----------
async function api(corpo) {
  if (!CFG.url) throw new Error('App sem configuração da planilha');
  const r = await fetch(CFG.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ chave: CFG.chave }, corpo))
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Erro na planilha');
  return j.estado;
}

async function atualizar() {
  try {
    await enviarFila();
    const e = await api({ acao: 'estado' });
    receber(e);
  } catch (err) {
    if (!estado) { telaErro('Sem conexão com a planilha. Abra o app de novo quando tiver internet.'); return; }
  }
  if (!telaFeito) render();
}

function receber(e) {
  estado = e;
  gravar(K_ESTADO, e);
  if (!atual || !telaFeito) atual = e.proximo;
}

// Envia, na ordem, os treinos guardados sem internet
async function enviarFila() {
  if (enviando || !fila.length) return;
  enviando = true;
  try {
    while (fila.length) {
      const e = await api(fila[0]);
      fila.shift();
      gravar(K_FILA, fila);
      receber(e);
    }
  } finally {
    enviando = false;
  }
}

window.aoVoltar = () => { if (estado) atualizar(); };
window.addEventListener('online', () => atualizar());

// ---------- telas ----------
function treinoAtual() { return estado.treinos.find(t => t.letra === atual) || estado.treinos[0]; }
function passo() { return atual === 'A' || atual === 'D' ? 2.5 : 1; }
function fmt(n) { return n === '' || n === null || n === undefined || isNaN(n) ? '' : String(Math.round(n * 100) / 100).replace('.', ','); }
function num(s) { s = String(s).trim().replace(',', '.'); return s === '' ? '' : Number(s); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function hojeIso() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hojeDiaMes() { const d = new Date(); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }

function render() {
  telaFeito = false;
  const t = treinoAtual();
  atual = t.letra;
  const e = estado;
  let topo = `<div class="topo"><span class="pill">${e.semana >= 1 ? 'Semana ' + Math.min(e.semana, e.totalSemanas) + ' de ' + e.totalSemanas : 'Antes do ciclo'}</span><span>${new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' })}</span></div>`;
  if (fila.length) topo += `<div class="fila">${fila.length === 1 ? '1 treino guardado' : fila.length + ' treinos guardados'} no celular. Vai para a planilha quando tiver internet.</div>`;
  if (e.semana < 1) topo += `<div class="info">O ciclo começa em ${e.inicioCiclo}.</div>`;
  if (e.semana > e.totalSemanas) topo += `<div class="info">O ciclo terminou. Hora de montar o próximo na planilha.</div>`;
  if (e.semanaLeve) topo += `<div class="aviso"><b>Semana leve:</b> faça metade das séries, com a mesma carga.</div>`;
  if (e.jaTreinouHoje) topo += `<div class="info">Você já registrou um treino hoje.</div>`;

  const letras = e.treinos.map(x => `<button class="${x.letra === atual ? 'ativo' : ''} ${x.letra === e.proximo ? 'prox' : ''}" onclick="trocar('${x.letra}')">${x.letra}</button>`).join('');

  const cards = t.exercicios.map((x, i) => {
    const foto = x.foto
      ? `<div class="foto" onclick="virar(${i})"><img id="img${i}" src="${esc(x.foto)}" loading="lazy" alt="${esc(x.nome)}" onerror="this.parentNode.innerHTML='<span class=sem>Foto indisponível sem internet</span>'">${/\/0\.jpg$/.test(x.foto) ? '<span class="dica">toque para ver o movimento</span>' : ''}</div>`
      : `<div class="foto"><span class="sem">Sem foto (adicione na aba Fotos do app)</span></div>`;
    return `<div class="card" id="card${i}">${foto}<div class="corpo">
      <div class="nome"><h3>${esc(x.nome)}</h3>${x.principal ? '<span class="tag">Principal</span>' : ''}</div>
      <div class="meta">${esc(x.series)} séries × ${esc(x.reps)} reps · descanso ${esc(x.descanso)}</div>
      <div class="linha">
        <div class="campo"><label>Carga (kg)</label><div class="stepper">
          <button onclick="somar(${i},-1)">−</button>
          <input id="c${i}" inputmode="decimal" value="${fmt(x.cargaAtual)}" placeholder="—">
          <button onclick="somar(${i},1)">+</button></div></div>
        <div class="campo"><label>Reps feitas</label>
          <input id="r${i}" inputmode="numeric" placeholder="${x.ultimasReps ? 'última: ' + esc(x.ultimasReps) : 'ex.: 8,8,7'}"></div>
      </div>
      <label class="feito"><input type="checkbox" id="f${i}" checked onchange="document.getElementById('card${i}').classList.toggle('off', !this.checked)"> Fiz este exercício</label>
    </div></div>`;
  }).join('');

  const hist = e.historico && e.historico.length ? `<div class="hist"><h4>Últimos treinos</h4><ul>${e.historico.map(h =>
    `<li><span>${h.dia} · Treino ${h.treino}</span>${h.pulado ? '<span class="pul">Pulado</span>' : `<span>${h.exercicios} exercícios</span>`}</li>`).join('')}</ul></div>` : '';

  document.getElementById('app').innerHTML = `${topo}
    <div class="hero"><small>${atual === e.proximo ? 'Treino de hoje' : 'Treino escolhido'}</small>
      <h1>Treino ${t.letra}</h1><h2>Foco: ${esc(t.foco)}</h2></div>
    <div class="letras">${letras}</div>${cards}${hist}`;
  document.getElementById('rodape').hidden = false;
  window.scrollTo(0, 0);
}

function telaErro(msg) {
  document.getElementById('rodape').hidden = true;
  document.getElementById('app').innerHTML = `<div class="centro"><div class="grande">📶</div><div>${esc(msg)}</div>
    <button class="btn prim" style="width:100%" onclick="atualizar()">Tentar de novo</button></div>`;
}

function trocar(l) { atual = l; render(); }

function somar(i, dir) {
  const el = document.getElementById('c' + i);
  const v = num(el.value);
  el.value = fmt(Math.max(0, (v === '' ? 0 : v) + dir * passo()));
}

function virar(i) {
  const img = document.getElementById('img' + i);
  if (!img || !/\/[01]\.jpg$/.test(img.src)) return;
  img.src = img.src.replace(/\/([01])\.jpg$/, (m, n) => '/' + (n === '0' ? '1' : '0') + '.jpg');
}

// ---------- salvar e pular ----------
function salvar() {
  const t = treinoAtual();
  const itens = [];
  t.exercicios.forEach((x, i) => {
    if (!document.getElementById('f' + i).checked) return;
    itens.push({ nome: x.nome, carga: num(document.getElementById('c' + i).value), reps: document.getElementById('r' + i).value.trim() });
  });
  if (!itens.length) { mostrarErro('Marque pelo menos um exercício, ou use Pular.'); return; }
  registrar({ acao: 'salvar', letra: t.letra, itens: itens, data: hojeIso() },
    `Treino ${t.letra} salvo`, `${itens.length} exercícios anotados.`);
}

function abrirPular() { document.getElementById('mLetra').textContent = atual; document.getElementById('motivo').value = ''; document.getElementById('modal').classList.add('on'); }
function fecharPular() { document.getElementById('modal').classList.remove('on'); }
function confirmarPular() {
  const motivo = document.getElementById('motivo').value.trim();
  fecharPular();
  registrar({ acao: 'pular', letra: atual, motivo: motivo, data: hojeIso() },
    `Treino ${atual} pulado`, 'Ficou anotado no Registro.');
}

// Tenta enviar na hora; sem internet, guarda no celular e mostra como feito
async function registrar(pedido, titulo, texto) {
  ocupado(true);
  fila.push(pedido);
  gravar(K_FILA, fila);
  let online = true;
  try { await enviarFila(); } catch (err) { online = false; }
  if (!online) aplicarLocal(pedido);
  ocupado(false);
  feito(titulo, online ? texto + ' Já está na planilha.' : texto + ' Sem internet: fica guardado no celular e vai para a planilha sozinho depois.');
}

// Atualiza a tela sem a planilha: avança o treino e põe no histórico
function aplicarLocal(p) {
  const letras = estado.treinos.map(t => t.letra);
  estado.proximo = letras[(letras.indexOf(p.letra) + 1) % letras.length];
  estado.jaTreinouHoje = true;
  if (p.acao === 'salvar') {
    const t = estado.treinos.find(x => x.letra === p.letra);
    p.itens.forEach(i => {
      const ex = t.exercicios.find(x => x.nome === i.nome);
      if (!ex) return;
      if (i.carga !== '') ex.cargaAtual = i.carga;
      if (i.reps) ex.ultimasReps = i.reps;
    });
  }
  estado.historico = [{ treino: p.letra, dia: hojeDiaMes(), pulado: p.acao === 'pular', exercicios: p.acao === 'salvar' ? p.itens.length : 0 }]
    .concat(estado.historico || []).slice(0, 8);
  gravar(K_ESTADO, estado);
}

function feito(titulo, texto) {
  telaFeito = true;
  atual = estado.proximo;
  const prox = treinoAtual();
  document.getElementById('rodape').hidden = true;
  document.getElementById('app').innerHTML = `<div class="centro"><div class="grande">✅</div>
    <h1 style="margin:0">${esc(titulo)}</h1><div style="color:var(--muted)">${esc(texto)}</div>
    <div class="info" style="width:100%">Próximo: <b>Treino ${prox.letra}</b> · ${esc(prox.foco)}</div>
    <button class="btn prim" style="width:100%" onclick="render()">Ver próximo treino</button></div>`;
  window.scrollTo(0, 0);
}

// Botão voltar do Android: fecha o painel de pular ou sai da tela de sucesso
window.voltar = () => {
  if (document.getElementById('modal').classList.contains('on')) { fecharPular(); return true; }
  if (telaFeito) { render(); return true; }
  return false;
};

function ocupado(sim) { const b = document.getElementById('salvar'); b.disabled = sim; b.textContent = sim ? 'Salvando…' : 'Salvar treino'; }
function mostrarErro(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 5000); }

// Abre na hora com o que estava guardado e depois atualiza pela planilha
if (estado) render();
atualizar();
</script>
</body>
</html>
